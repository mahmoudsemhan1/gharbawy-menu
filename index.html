<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">القائمة الرقمية - الغرباوي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif; 
            background-color: #fcfbfa; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-stone-900 min-h-screen flex flex-col selection:bg-amber-800 selection:text-white">

    <!-- Header -->
    <header class="bg-white border-b border-stone-200/85 sticky top-0 z-50 backdrop-blur-md bg-opacity-95">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-stone-900 rounded-xl p-1 shadow-sm flex items-center justify-center border border-amber-800/30">
                    <img src="logo-01.png" alt="Al-Gharbawy" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 id="brandTitle" class="text-xs font-black tracking-wider text-stone-900 uppercase">الغرباوي</h1>
                    <p id="brandSub" class="text-[10px] text-stone-400">القائمة الرقمية • منذ 1970</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Language Toggle Button -->
                <button onclick="toggleLanguage()" class="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-bold rounded-xl transition flex items-center gap-1.5">
                    🌐 <span id="langBtnText">English</span>
                </button>

                <div id="adminBadge" class="hidden text-[11px] text-amber-800 font-bold bg-amber-50 px-3 py-1 rounded-lg border border-amber-200">
                    ⚙️ <span id="adminText">وضع المشرف</span>
                </div>
                <div id="customerBadge" class="text-[11px] text-stone-600 font-semibold bg-stone-100 px-3 py-1 rounded-lg">
                    ☕ <span id="freshText">محمصة طازجة</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 flex-grow w-full space-y-6">
        
        <!-- Admin Panel: Add New Item -->
        <div id="adminPanelSection" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-stone-200 space-y-4">
            <div class="flex justify-between items-center border-b border-stone-100 pb-3">
                <h2 id="adminPanelTitle" class="text-xs font-black text-stone-900">🛠️ إضافة عنصر جديد للقائمة</h2>
                <span id="liveUpdateBadge" class="text-[10px] bg-amber-100 text-amber-900 font-bold px-2.5 py-0.5 rounded-md">تحديث فوري</span>
            </div>
            
            <form id="addItemForm" onsubmit="addNewItem(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label id="labelNameAr" class="block text-[10px] font-bold text-stone-500 mb-1">اسم العنصر (عربي)</label>
                    <input type="text" id="newNameAr" required placeholder="مثال: سبانش لاتيه" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label id="labelNameEn" class="block text-[10px] font-bold text-stone-500 mb-1">اسم العنصر (إنجليزي)</label>
                    <input type="text" id="newNameEn" required placeholder="e.g. Spanish Latte" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition text-left" dir="ltr">
                </div>
                <div>
                    <label id="labelCategory" class="block text-[10px] font-bold text-stone-500 mb-1">القسم</label>
                    <select id="newCategory" required class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                        <option value="Hot Coffee">قهوة ساخنة / Hot Coffee</option>
                        <option value="Specialty Coffee">قهوة مختصة / Specialty Coffee</option>
                        <option value="Iced Coffee">قهوة مثلجة / Iced Coffee</option>
                        <option value="Iced Frappe">فرابتيه مثلج / Iced Frappe</option>
                        <option value="Milkshake">ميلك شيك / Milkshake</option>
                        <option value="Smoothie">سموذي / Smoothie</option>
                        <option value="Non-Coffee">مشروبات ساخنة أخرى / Non-Coffee</option>
                        <option value="Mojito">موهيتو / Mojito</option>
                        <option value="Soft Drink">مشروبات غازية / Soft Drink</option>
                        <option value="Fresh Juice">عصائر طازجة / Fresh Juice</option>
                        <option value="Cookie & Cake">كيك وكوكيز / Cookie & Cake</option>
                        <option value="Cold Sandwich">ساندويتشات باردة / Cold Sandwich</option>
                        <option value="Main Dish">أطباق رئيسية / Main Dish</option>
                        <option value="Salad">سلطات / Salad</option>
                        <option value="Bakery">مخبوزات / Bakery</option>
                        <option value="Breakfast">فطور / Breakfast</option>
                    </select>
                </div>
                <div>
                    <label id="labelPrice" class="block text-[10px] font-bold text-stone-500 mb-1">السعر (جنيه)</label>
                    <input type="number" id="newPrice" required placeholder="65" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label id="labelImgSource" class="block text-[10px] font-bold text-stone-500 mb-1">مصدر الصورة</label>
                    <div class="space-y-1.5">
                        <input type="file" id="newImageFile" accept="image/*" class="w-full px-2 py-1 bg-stone-50 border border-stone-200 rounded-xl text-[10px] outline-none file:mr-2 file:py-0.5 file:px-2 file:rounded-lg file:border-0 file:text-[9px] file:font-semibold file:bg-stone-900 file:text-white hover:file:bg-stone-800 transition">
                        <input type="url" id="newImageUrl" placeholder="أو رابط الصورة..." class="w-full px-3 py-1.5 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                    </div>
                </div>
                <div>
                    <label id="labelDescAr" class="block text-[10px] font-bold text-stone-500 mb-1">الوصف (عربي)</label>
                    <input type="text" id="newDescAr" placeholder="وصف المكونات..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div class="sm:col-span-2">
                    <label id="labelDescEn" class="block text-[10px] font-bold text-stone-500 mb-1">الوصف (إنجليزي)</label>
                    <input type="text" id="newDescEn" placeholder="Ingredients description..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition text-left" dir="ltr">
                </div>
                <div class="sm:col-span-2 flex justify-end pt-1">
                    <button type="submit" id="addBtnText" class="bg-stone-900 hover:bg-stone-800 text-white px-5 py-2 rounded-xl text-xs font-bold transition">إضافة العنصر ➕</button>
                </div>
            </form>
        </div>

        <!-- Search & Categories Bar -->
        <div class="space-y-3 sticky top-14 bg-[#fcfbfa] py-2 z-40">
            <div class="relative">
                <input type="text" id="searchInput" oninput="filterMenu()" placeholder="ابحث في القائمة..." class="w-full px-4 py-2.5 ps-10 bg-white border border-stone-200 rounded-2xl text-xs outline-none focus:border-stone-900 shadow-sm transition">
                <span class="absolute start-3.5 top-3 text-stone-400 text-sm">🔍</span>
            </div>
            <div id="categoryTabs" class="flex overflow-x-auto gap-2 pb-1 no-scrollbar">
                <!-- Categories dynamically loaded -->
            </div>
        </div>

        <!-- Menu Grid -->
        <div id="customerMenuGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <!-- Items dynamically loaded -->
        </div>
    </main>

    <!-- Item Details Modal -->
    <div id="itemModal" class="fixed inset-0 bg-stone-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-stone-100 relative animate-in fade-in zoom-in duration-200">
            <button onclick="closeModal()" class="absolute top-4 end-4 w-8 h-8 bg-stone-100 hover:bg-stone-200 rounded-full flex items-center justify-center text-stone-600 text-xs font-bold transition">✕</button>
            <img id="modalImage" src="" class="w-full h-48 rounded-2xl object-cover bg-stone-100 shadow-inner">
            <div class="space-y-1.5">
                <span id="modalCategory" class="text-[10px] font-bold text-amber-800 bg-amber-50 px-2.5 py-1 rounded-md inline-block"></span>
                <h2 id="modalName" class="text-base font-black text-stone-900"></h2>
                <p id="modalDesc" class="text-xs text-stone-500 leading-relaxed pt-1"></p>
            </div>
            <div class="flex justify-between items-center pt-3 border-t border-stone-100">
                <span id="modalPriceLabel" class="text-xs text-stone-400 font-semibold">السعر:</span>
                <span id="modalPrice" class="text-base font-black text-stone-900"></span>
            </div>
        </div>
    </div>

    <!-- Edit Item Modal -->
    <div id="editModal" class="fixed inset-0 bg-stone-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl border border-stone-100 relative">
            <div class="flex justify-between items-center border-b border-stone-100 pb-3">
                <h2 class="text-xs font-black text-stone-900">✏️ تعديل عنصر القائمة</h2>
                <button onclick="closeEditModal()" class="w-7 h-7 bg-stone-100 hover:bg-stone-200 rounded-full flex items-center justify-center text-stone-600 text-xs font-bold transition">✕</button>
            </div>
            <form id="editItemForm" onsubmit="updateItem(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="hidden" id="editId">
                <input type="hidden" id="editOldImage">
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">الاسم (عربي)</label>
                    <input type="text" id="editNameAr" required class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">الاسم (إنجليزي)</label>
                    <input type="text" id="editNameEn" required class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition text-left" dir="ltr">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">القسم</label>
                    <select id="editCategory" required class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                        <option value="Hot Coffee">Hot Coffee</option>
                        <option value="Specialty Coffee">Specialty Coffee</option>
                        <option value="Iced Coffee">Iced Coffee</option>
                        <option value="Iced Frappe">Iced Frappe</option>
                        <option value="Milkshake">Milkshake</option>
                        <option value="Smoothie">Smoothie</option>
                        <option value="Non-Coffee">Non-Coffee</option>
                        <option value="Mojito">Mojito</option>
                        <option value="Soft Drink">Soft Drink</option>
                        <option value="Fresh Juice">Fresh Juice</option>
                        <option value="Cookie & Cake">Cookie & Cake</option>
                        <option value="Cold Sandwich">Cold Sandwich</option>
                        <option value="Main Dish">Main Dish</option>
                        <option value="Salad">Salad</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Breakfast">Breakfast</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">السعر (جنيه)</label>
                    <input type="number" id="editPrice" required class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">تغيير الصورة</label>
                    <div class="space-y-1.5">
                        <input type="file" id="editImageFile" accept="image/*" class="w-full px-2 py-1 bg-stone-50 border border-stone-200 rounded-xl text-[10px] outline-none file:mr-2 file:py-0.5 file:px-2 file:rounded-lg file:border-0 file:text-[9px] file:font-semibold file:bg-stone-900 file:text-white hover:file:bg-stone-800 transition">
                        <input type="url" id="editImageUrl" placeholder="رابط صورة جديد..." class="w-full px-3 py-1.5 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">الوصف (عربي)</label>
                    <input type="text" id="editDescAr" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">الوصف (إنجليزي)</label>
                    <input type="text" id="editDescEn" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition text-left" dir="ltr">
                </div>
                <div class="sm:col-span-2 flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-stone-100 text-stone-600 rounded-xl text-xs font-bold transition">إلغاء</button>
                    <button type="submit" class="px-5 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-xl text-xs font-bold transition">حفظ التعديلات 💾</button>
                </div>
            </form>
        </div>
    </div>

    <footer id="footerText" class="text-center py-6 text-[11px] text-stone-400 border-t border-stone-200 mt-auto bg-white">
        الغرباوي © 2026 ☕ جميع الحقوق محفوظة
    </footer>

            { id: 17, nameAr: 'كيك فدج بالشوكولاتة', nameEn: 'Chocolate Fudge Cake', category: 'Cookie & Cake', price: 65, image: 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=500&q=80', descAr: 'قطعة كيك شوكولاتة غنية متعددة الطبقات.', descEn: 'Decadent multi-layered chocolate cake slice.' },
            { id: 18, nameAr: 'ساندويتش تركي مدخن', nameEn: 'Smoked Turkey Sandwich', category: 'Cold Sandwich', price: 85, image: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=500&q=80', descAr: 'تركي مدخن شرائح مع الجبن والخس في خبز طازج.', descEn: 'Sliced smoked turkey with cheese and lettuce in fresh bread.' },
            { id: 19, nameAr: 'باستا دجاج مشوي', nameEn: 'Grilled Chicken Pasta', category: 'Main Dish', price: 120, image: 'https://images.unsplash.com/photo-1621996346565-e3d5d6281298?auto=format&fit=crop&w=500&q=80', descAr: 'مكرونة بيني بالصوص الأبيض الكريمي ودجاج مشوي.', descEn: 'Penne pasta with creamy white sauce and tender grilled chicken.' },
            { id: 20, nameAr: 'سلطة سيزر', nameEn: 'Caesar Salad', category: 'Salad', price: 75, image: 'https://images.unsplash.com/photo-1550304943-4f24f54ddde9?auto=format&fit=crop&w=500&q=80', descAr: 'خس روماني مقرمش، كروتون، جبن بارميزان وصوص سيزر.', descEn: 'Crisp romaine lettuce, croutons, parmesan, and Caesar dressing.' },
            { id: 21, nameAr: 'كرواسون زبدة', nameEn: 'Butter Croissant', category: 'Bakery', price: 40, image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=500&q=80', descAr: 'معجنات فرنسية مخبوزة طازجة وهشة بالزبدة.', descEn: 'Flaky, buttery, freshly baked French pastry.' },
            { id: 22, nameAr: 'طبق فطور كلاسيكي', nameEn: 'Classic Breakfast Platter', category: 'Breakfast', price: 95, image: 'https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=500&q=80', descAr: 'بيض، توست، جبن وسلطة جانبية طازجة.', descEn: 'Eggs, toast, cheese, and fresh side salad.' }
        ];

        let activeCategory = 'All';
        let isAdminMode = false;

        window.onload = function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            isAdminMode = !isMobile;

            if (isAdminMode) {
                document.getElementById('adminPanelSection').classList.remove('hidden');
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('customerBadge').classList.add('hidden');
            } else {
                document.getElementById('adminPanelSection').classList.add('hidden');
                document.getElementById('adminBadge').classList.add('hidden');
                document.getElementById('customerBadge').classList.remove('hidden');
            }
            applyLanguageUI();
            renderCustomerMenu();
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('gharbaoui_lang', currentLang);
            applyLanguageUI();
            renderCustomerMenu();
        }

        function applyLanguageUI() {
            const htmlRoot = document.getElementById('htmlRoot');
            const langBtnText = document.getElementById('langBtnText');
            const searchInput = document.getElementById('searchInput');

            if (currentLang === 'en') {
                htmlRoot.setAttribute('lang', 'en');
                htmlRoot.setAttribute('dir', 'ltr');
                langBtnText.innerText = 'العربية';
                document.getElementById('pageTitle').innerText = 'Al-Gharbawy - Digital Menu';
                document.getElementById('brandTitle').innerText = 'Al-Gharbawy';
                document.getElementById('brandSub').innerText = 'Digital Menu • Est. 1970';
                document.getElementById('adminText').innerText = 'Admin Mode';
                document.getElementById('freshText').innerText = 'Freshly Roasted';
                document.getElementById('adminPanelTitle').innerText = '🛠️ Add New Menu Item';
                document.getElementById('liveUpdateBadge').innerText = 'Live Update';
                document.getElementById('labelNameAr').innerText = 'Item Name (Arabic)';
                document.getElementById('labelNameEn').innerText = 'Item Name (English)';
                document.getElementById('labelCategory').innerText = 'Category';
                document.getElementById('labelPrice').innerText = 'Price (EGP)';
                document.getElementById('labelImgSource').innerText = 'Image Source';
                document.getElementById('labelDescAr').innerText = 'Description (Arabic)';
                document.getElementById('labelDescEn').innerText = 'Description (English)';
                document.getElementById('addBtnText').innerText = 'Add Item ➕';
                searchInput.placeholder = 'Search menu items...';
                document.getElementById('modalPriceLabel').innerText = 'Price:';
                document.getElementById('footerText').innerText = 'Al-Gharbawy © 2026 ☕ All Rights Reserved';
            } else {
                htmlRoot.setAttribute('lang', 'ar');
                htmlRoot.setAttribute('dir', 'rtl');
                langBtnText.innerText = 'English';
                document.getElementById('pageTitle').innerText = 'القائمة الرقمية - الغرباوي';
                document.getElementById('brandTitle').innerText = 'الغرباوي';
                document.getElementById('brandSub').innerText = 'القائمة الرقمية • منذ 1970';
                document.getElementById('adminText').innerText = 'وضع المشرف';
                document.getElementById('freshText').innerText = 'محمصة طازجة';
                document.getElementById('adminPanelTitle').innerText = '🛠️ إضافة عنصر جديد للقائمة';
                document.getElementById('liveUpdateBadge').innerText = 'تحديث فوري';
                document.getElementById('labelNameAr').innerText = 'اسم العنصر (عربي)';
                document.getElementById('labelNameEn').innerText = 'اسم العنصر (إنجليزي)';
                document.getElementById('labelCategory').innerText = 'القسم';
                document.getElementById('labelPrice').innerText = 'السعر (جنيه)';
                document.getElementById('labelImgSource').innerText = 'مصدر الصورة';
                document.getElementById('labelDescAr').innerText = 'الوصف (عربي)';
                document.getElementById('labelDescEn').innerText = 'الوصف (إنجليزي)';
                document.getElementById('addBtnText').innerText = 'إضافة العنصر ➕';
                searchInput.placeholder = 'ابحث في القائمة...';
                document.getElementById('modalPriceLabel').innerText = 'السعر:';
                document.getElementById('footerText').innerText = 'الغرباوي © 2026 ☕ جميع الحقوق محفوظة';
            }
        }

        function addNewItem(e) {
            e.preventDefault();
            const fileInput = document.getElementById('newImageFile');
            const urlInput = document.getElementById('newImageUrl').value.trim();
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    saveNewItemData(uploadEvent.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else if (urlInput) {
                saveNewItemData(urlInput);
            } else {
                saveNewItemData('https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=500&q=80');
            }
        }

        function saveNewItemData(imgSrc) {
            const newItem = {
                id: Date.now(),
                nameAr: document.getElementById('newNameAr').value,
                nameEn: document.getElementById('newNameEn').value,
                category: document.getElementById('newCategory').value,
                price: parseFloat(document.getElementById('newPrice').value),
                image: imgSrc,
                descAr: document.getElementById('newDescAr').value || 'طازج ومعد بعناية.',
                descEn: document.getElementById('newDescEn').value || 'Freshly prepared.'
            };
            menuItems.push(newItem);
            localStorage.setItem('gharbaoui_menu_bilingual_v1', JSON.stringify(menuItems));
            document.getElementById('addItemForm').reset();
            renderCustomerMenu();
            alert(currentLang === 'en' ? 'Item added successfully!' : 'تم إضافة العنصر بنجاح!');
        }

        function deleteItem(id, event) {
            event.stopPropagation();
            if (confirm(currentLang === 'en' ? 'Are you sure you want to delete this item?' : 'هل أنت متأكد من حذف هذا العنصر؟')) {
                menuItems = menuItems.filter(item => item.id !== id);
                localStorage.setItem('gharbaoui_menu_bilingual_v1', JSON.stringify(menuItems));
                renderCustomerMenu();
            }
        }

        function openEditModal(id, event) {
            event.stopPropagation();
            const item = menuItems.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('editOldImage').value = item.image;
            document.getElementById('editNameAr').value = item.nameAr;
            document.getElementById('editNameEn').value = item.nameEn;
            document.getElementById('editCategory').value = item.category;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editDescAr').value = item.descAr || '';
            document.getElementById('editDescEn').value = item.descEn || '';
            document.getElementById('editImageFile').value = '';
            document.getElementById('editImageUrl').value = '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function updateItem(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('editId').value);
            const oldImage = document.getElementById('editOldImage').value;
            const fileInput = document.getElementById('editImageFile');
            const urlInput = document.getElementById('editImageUrl').value.trim();

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    saveUpdatedItemData(id, uploadEvent.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else if (urlInput) {
                saveUpdatedItemData(id, urlInput);
            } else {
                saveUpdatedItemData(id, oldImage);
            }
        }

        function saveUpdatedItemData(id, imgSrc) {
            const index = menuItems.findIndex(i => i.id === id);
            if (index !== -1) {
                menuItems[index] = {
                    id: id,
                    nameAr: document.getElementById('editNameAr').value,
                    nameEn: document.getElementById('editNameEn').value,
                    category: document.getElementById('editCategory').value,
                    price: parseFloat(document.getElementById('editPrice').value),
                    image: imgSrc,
                    descAr: document.getElementById('editDescAr').value,
                    descEn: document.getElementById('editDescEn').value
                };

                localStorage.setItem('gharbaoui_menu_bilingual_v1', JSON.stringify(menuItems));
                closeEditModal();
                renderCustomerMenu();
                alert(currentLang === 'en' ? 'Item updated successfully!' : 'تم تحديث العنصر بنجاح!');
            }
        }

        function openItemDetails(name, categoryReadable, price, image, desc) {
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalCategory').innerText = categoryReadable;
            document.getElementById('modalPrice').innerText = price + (currentLang === 'en' ? ' EGP' : ' جنيه');
            document.getElementById('modalImage').src = image;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        function renderCustomerMenu() {
            const tabsContainer = document.getElementById('categoryTabs');
            
            tabsContainer.innerHTML = categoriesList.map(cat => {
                const catLabel = categoryNames[cat] ? categoryNames[cat][currentLang] : cat;
                return `
                    <button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeCategory === cat ? 'bg-stone-900 text-white shadow-sm' : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-50'}">
                        ${catLabel}
                    </button>
                `;
            }).join('');

            filterMenu();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCustomerMenu();
        }

        function filterMenu() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const gridContainer = document.getElementById('customerMenuGrid');

            let filtered = menuItems.filter(item => {
                const matchesCategory = (activeCategory === 'All' || item.category === activeCategory);
                const nameMatch = item.nameAr.toLowerCase().includes(searchVal) || item.nameEn.toLowerCase().includes(searchVal);
                const descMatch = (item.descAr && item.descAr.toLowerCase().includes(searchVal)) || (item.descEn && item.descEn.toLowerCase().includes(searchVal));
                return matchesCategory && (nameMatch || descMatch);
            });

            if (filtered.length === 0) {
                gridContainer.innerHTML = `<div class="col-span-full text-center py-16 text-stone-400 text-xs">${currentLang === 'en' ? 'No items found matching your search.' : 'لا توجد عناصر مطابقة لبحثك.'}</div>`;
                return;
            }

            gridContainer.innerHTML = filtered.map(item => {
                const itemName = currentLang === 'en' ? item.nameEn : item.nameAr;
                const itemDesc = currentLang === 'en' ? item.descEn : item.descAr;
                const catReadable = categoryNames[item.category] ? categoryNames[item.category][currentLang] : item.category;
                
                const safeName = itemName.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeDesc = (itemDesc || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeCatReadable = catReadable.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                let adminActions = '';
                if (isAdminMode) {
                    adminActions = `
                        <div class="absolute top-2 end-2 flex gap-1 bg-white/90 backdrop-blur-sm p-1 rounded-xl shadow-sm border border-stone-200 opacity-95 sm:opacity-0 group-hover:opacity-100 transition">
                            <button onclick="openEditModal(${item.id}, event)" class="w-6 h-6 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-lg flex items-center justify-center text-[10px] font-bold" title="Edit">✏️</button>
                            <button onclick="deleteItem(${item.id}, event)" class="w-6 h-6 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg flex items-center justify-center text-[10px] font-bold" title="Delete">🗑️</button>
                        </div>
                    `;
                }

                return `
                <div onclick="openItemDetails('${safeName}', '${safeCatReadable}', ${item.price}, '${item.image}', '${safeDesc}')" class="bg-white rounded-2xl p-3 border border-stone-200/70 shadow-sm flex items-center gap-3.5 relative group hover:border-stone-400 cursor-pointer transition">
                    <img src="${item.image}" class="w-20 h-20 rounded-xl object-cover bg-stone-100 flex-shrink-0">
                    <div class="flex-grow min-w-0">
                        <span class="text-[10px] font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded-md inline-block mb-1">${catReadable}</span>
                        <h3 class="font-black text-xs sm:text-sm text-stone-900 truncate">${itemName}</h3>
                        <p class="text-[11px] text-stone-400 truncate mt-0.5">${itemDesc}</p>
                        <div class="mt-2 font-black text-xs sm:text-sm text-stone-900">${item.price} ${currentLang === 'en' ? 'EGP' : 'جنيه'}</div>
                    </div>
                    ${adminActions}
                </div>
                `;
            }).join('');
        }
    </script>
