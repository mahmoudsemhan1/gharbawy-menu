<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بن الغرباوي - المنيو الرقمي</title>
    <!-- Tailwind CSS للتصميم الاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #faf6f0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-stone-800 min-h-screen flex flex-col selection:bg-amber-800 selection:text-white">

    <!-- رأس الصفحة العصري -->
    <header class="bg-stone-900 text-white shadow-xl sticky top-0 z-40 border-b border-amber-900/30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="logo-01.png" alt="بن الغرباوي" class="w-12 h-12 object-contain bg-white rounded-2xl p-1 shadow-md">
                <div>
                    <h1 class="text-sm font-black tracking-wide text-amber-500">بن الغرباوي</h1>
                    <p class="text-[10px] text-stone-300">الفرع الرئيسي - المنيو الرقمي</p>
                </div>
            </div>
            <div class="text-xs text-amber-400 font-bold bg-amber-950/60 px-3 py-1.5 rounded-xl border border-amber-800/40">
                ☕ متاح طوال أيام الأسبوع
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 flex-grow w-full space-y-6">
        <!-- بانر ترحيبي فخم -->
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-stone-900 via-amber-950 to-stone-950 text-white p-8 shadow-xl border border-amber-900/30 text-center flex flex-col items-center">
            <img src="logo-01.png" alt="بن الغرباوي" class="w-28 h-28 object-contain mb-3 drop-shadow-lg">
            <h2 class="text-2xl sm:text-3xl font-black mb-1 text-amber-400">كيف نضبط قهوتك اليوم؟</h2>
            <p class="text-stone-300 text-xs sm:text-sm max-w-md">أجود أنواع البن المحموص طازجاً والمشروبات المصنوعة بحرفية خصيصاً لك.</p>
        </div>

        <!-- شريط البحث والأقسام -->
        <div class="space-y-3">
            <div class="relative">
                <input type="text" id="searchInput" oninput="filterMenu()" placeholder="ابحث عن مشروبك المفضل، اسبريسو، لوتس..." class="w-full px-4 py-3.5 pr-11 bg-white border border-stone-200 rounded-2xl text-sm shadow-sm focus:ring-2 focus:ring-amber-900 outline-none">
                <span class="absolute right-4 top-4 text-stone-400 text-base">🔍</span>
            </div>
            <div id="categoryTabs" class="flex overflow-x-auto gap-2 pb-2 no-scrollbar">
                <!-- تتعبئ تلقائياً -->
            </div>
        </div>

        <!-- شبكة الأصناف -->
        <div id="customerMenuGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- تتعبئ تلقائياً -->
        </div>
    </main>

    <footer class="text-center py-6 text-xs text-stone-500 border-t border-stone-200 mt-auto bg-white">
        جميع الحقوق محفوظة © بن الغرباوي 2026 ☕
    </footer>

    <script>
        const menuItems = [
            { id: 1, name: 'إسبريسو دوبل ممتاز', category: 'قهوة مختصة', price: 40, image: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=500&q=80', desc: 'جرعة إسبريسو غنية ومكثفة من بن الغرباوي الأصلي.', badge: 'الأكثر طلباً ⭐' },
            { id: 2, name: 'قهوة تركي مظبوطة باللبن', category: 'مشروبات ساخنة', price: 35, image: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=500&q=80', desc: 'بن محوج طازج محضر على الوجاق بالطريقة الأصلية.', badge: 'مميز ☕' },
            { id: 3, name: 'ايس كراميل ماكياتو', category: 'مشروبات باردة', price: 70, image: 'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=500&q=80', desc: 'إسبريسو بارد مع الحليب المثلج وصوص الكراميل الفاخر.' },
            { id: 4, name: 'موخيتو ليمون ونعناع', category: 'عصائر فريش', price: 55, image: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=500&q=80', desc: 'مشروب منعش للغاية بالنعناع الفريش والليمون والصودا.', badge: 'منعش ❄️' },
            { id: 5, name: 'تشيز كيك لوتس غني', category: 'حلويات', price: 65, image: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=500&q=80', desc: 'قطعة تشيز كيك طازجة مغطاة بزبدة وبسكويت اللوتس المقرمش.' }
        ];

        let activeCategory = 'الكل';

        window.onload = function() {
            renderCustomerMenu();
        };

        function renderCustomerMenu() {
            const categories = ['الكل', ...new Set(menuItems.map(i => i.category))];
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-4 py-2.5 rounded-2xl text-xs font-bold transition whitespace-nowrap shadow-sm ${activeCategory === cat ? 'bg-amber-900 text-white shadow-md' : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-50'}">
                    ${cat}
                </button>
            `).join('');
            filterMenu();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCustomerMenu();
        }

        function filterMenu() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const gridContainer = document.getElementById('customerMenuGrid');

            let filtered = menuItems.filter(item => {
                const matchesCategory = (activeCategory === 'الكل' || item.category === activeCategory);
                const matchesSearch = item.name.toLowerCase().includes(searchVal) || (item.desc && item.desc.toLowerCase().includes(searchVal));
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                gridContainer.innerHTML = `<div class="col-span-full text-center py-16 text-stone-400 text-sm">عذراً، لم نجد نتائج مطابقة لبحثك.</div>`;
                return;
            }

            gridContainer.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-stone-100 flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="h-52 overflow-hidden relative bg-stone-100">
                            <img src="${item.image}" class="w-full h-full object-cover">
                            ${item.badge ? `<span class="absolute top-3 right-3 bg-amber-900 text-amber-200 text-[10px] px-3 py-1 rounded-full font-black shadow">${item.badge}</span>` : ''}
                            <span class="absolute bottom-3 right-3 bg-stone-900/80 backdrop-blur-md text-white text-[11px] px-3 py-1 rounded-full font-bold">${item.category}</span>
                        </div>
                        <div class="p-5">
                            <h3 class="font-black text-lg text-stone-900 mb-1">${item.name}</h3>
                            <p class="text-xs text-stone-500 leading-relaxed line-clamp-2">${item.desc || 'مجهز طازجاً بأجود الخامات.'}</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex items-center justify-between mt-2">
                        <span class="text-amber-900 font-black text-xl">${item.price} <span class="text-xs font-normal text-stone-400">ج.م</span></span>
                        <span class="text-xs font-bold text-stone-400 bg-stone-50 px-3 py-1.5 rounded-xl border">طازج يومياً</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
