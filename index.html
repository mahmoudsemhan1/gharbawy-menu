<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El-Gharbaoui Coffee - Digital Menu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfbfa; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-stone-900 min-h-screen flex flex-col selection:bg-amber-800 selection:text-white">

    <!-- Header -->
    <header class="bg-white border-b border-stone-200/85 sticky top-0 z-50 backdrop-blur-md bg-opacity-95">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-stone-900 rounded-xl p-1 shadow-sm flex items-center justify-center">
                    <img src="logo-01.png" alt="El-Gharbaoui" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-xs font-black tracking-wider text-stone-900">El-Gharbaoui Coffee</h1>
                    <p class="text-[10px] text-stone-400">Digital Menu</p>
                </div>
            </div>
            
            <div id="adminBadge" class="hidden text-[11px] text-amber-800 font-bold bg-amber-50 px-3 py-1 rounded-lg border border-amber-200">
                ⚙️ Admin Mode
            </div>
            <div id="customerBadge" class="text-[11px] text-stone-600 font-semibold bg-stone-100 px-3 py-1 rounded-lg">
                ☕ Freshly Roasted
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 flex-grow w-full space-y-6">
        
        <!-- Admin Panel (Visible on Desktop) -->
        <div id="adminPanelSection" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-stone-200 space-y-4">
            <div class="flex justify-between items-center border-b border-stone-100 pb-3">
                <h2 id="formTitle" class="text-xs font-black text-stone-900">🛠️ Add New Menu Item</h2>
                <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden text-[10px] bg-stone-200 text-stone-700 font-bold px-2.5 py-0.5 rounded-md">Cancel Edit</button>
            </div>
            
            <form id="addItemForm" onsubmit="handleFormSubmit(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="hidden" id="editIndex" value="">
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Item Name</label>
                    <input type="text" id="newName" required placeholder="e.g. Spanish Latte" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Category</label>
                    <select id="newCategory" required class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                        <option value="Hot Coffee">Hot Coffee</option>
                        <option value="Specialty Coffee">Specialty Coffee</option>
                        <option value="Iced Coffee">Iced Coffee</option>
                        <option value="Iced Frappe">Iced Frappe</option>
                        <option value="Milkshake">Milkshake</option>
                        <option value="Smoothie">Smoothie</option>
                        <option value="Non-Coffee">Non-Coffee</option>
                        <option value="Mojito">Mojito</option>
                        <option value="Soft Drink">Soft Drink</option>
                        <option value="Fresh Juice">Fresh Juice</option>
                        <option value="Cookie & Cake">Cookie & Cake</option>
                        <option value="Cold Sandwich">Cold Sandwich</option>
                        <option value="Main Dish">Main Dish</option>
                        <option value="Salad">Salad</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Breakfast">Breakfast</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Price (EGP)</label>
                    <input type="number" id="newPrice" required placeholder="65" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Image URL (Optional if uploading file)</label>
                    <input type="url" id="newImage" placeholder="https://..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Or Upload Image from Device</label>
                    <input type="file" id="imageFile" accept="image/*" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-stone-900 file:text-white hover:file:bg-stone-800">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Description</label>
                    <input type="text" id="newDesc" placeholder="Short description of ingredients..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div class="sm:col-span-2 flex justify-end pt-1">
                    <button type="submit" id="submitBtn" class="bg-stone-900 hover:bg-stone-800 text-white px-5 py-2 rounded-xl text-xs font-bold transition">Add Item ➕</button>
                </div>
            </form>
        </div>

        <!-- Search & Categories Bar -->
        <div class="space-y-3 sticky top-14 bg-[#fcfbfa] py-2 z-40">
            <div class="relative">
                <input type="text" id="searchInput" oninput="filterMenu()" placeholder="Search menu..." class="w-full px-4 py-2.5 pl-10 bg-white border border-stone-200 rounded-2xl text-xs outline-none focus:border-stone-900 shadow-sm transition">
                <span class="absolute left-3.5 top-3 text-stone-400 text-sm">🔍</span>
            </div>
            <div id="categoryTabs" class="flex overflow-x-auto gap-2 pb-1 no-scrollbar">
                <!-- Categories dynamically loaded -->
            </div>
        </div>

        <!-- Menu Grid -->
        <div id="customerMenuGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <!-- Items dynamically loaded -->
        </div>
    </main>

    <footer class="text-center py-6 text-[11px] text-stone-400 border-t border-stone-200 mt-auto bg-white">
        El-Gharbaoui Coffee © 2026 ☕
    </footer>

    <script>
        let menuItems = JSON.parse(localStorage.getItem('gharbaoui_menu_v5')) || [
            { id: 1, name: 'Double Espresso', category: 'Hot Coffee', price: 40, image: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=500&q=80', desc: 'Rich and intense shot of pure roasted coffee.' },
            { id: 2, name: 'Spanish Latte', category: 'Specialty Coffee', price: 75, image: 'https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=500&q=80', desc: 'Espresso with textured milk and sweet condensed milk.' }
        ];

        let activeCategory = 'All';
        let isAdminMode = false;

        window.onload = function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                isAdminMode = false;
                document.getElementById('adminPanelSection').classList.add('hidden');
                document.getElementById('adminBadge').classList.add('hidden');
                document.getElementById('customerBadge').classList.remove('hidden');
            } else {
                isAdminMode = true;
                document.getElementById('adminPanelSection').classList.remove('hidden');
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('customerBadge').classList.add('hidden');
            }
            renderCustomerMenu();
        };

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editIndex').value;
            const name = document.getElementById('newName').value;
            const category = document.getElementById('newCategory').value;
            const price = parseFloat(document.getElementById('newPrice').value);
            const desc = document.getElementById('newDesc').value || 'Freshly prepared.';
            const urlInput = document.getElementById('newImage').value;
            const fileInput = document.getElementById('imageFile').files[0];

            if (fileInput) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    saveItemData(editId, name, category, price, uploadEvent.target.result, desc);
                };
                reader.readAsDataURL(fileInput);
            } else {
                const defaultImage = urlInput || 'https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=500&q=80';
                saveItemData(editId, name, category, price, defaultImage, desc);
            }
        }

        function saveItemData(editId, name, category, price, image, desc) {
            if (editId) {
                // تعديل صنف موجود
                let item = menuItems.find(i => i.id == editId);
                if (item) {
                    item.name = name;
                    item.category = category;
                    item.price = price;
                    item.image = image;
                    item.desc = desc;
                }
                alert('Item updated successfully!');
            } else {
                // إضافة صنف جديد
                const newItem = {
                    id: Date.now(),
                    name: name,
                    category: category,
                    price: price,
                    image: image,
                    desc: desc
                };
                menuItems.push(newItem);
                alert('Item added successfully!');
            }

            localStorage.setItem('gharbaoui_menu_v5', JSON.stringify(menuItems));
            resetForm();
            renderCustomerMenu();
        }

        function editItem(id) {
            const item = menuItems.find(i => i.id == id);
            if (!item) return;

            document.getElementById('editIndex').value = item.id;
            document.getElementById('newName').value = item.name;
            document.getElementById('newCategory').value = item.category;
            document.getElementById('newPrice').value = item.price;
            document.getElementById('newImage').value = item.image.startsWith('data:') ? '' : item.image;
            document.getElementById('newDesc').value = item.desc;

            document.getElementById('formTitle').innerText = '🛠️ Edit Menu Item';
            document.getElementById('submitBtn').innerText = 'Update Item 💾';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('addItemForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('formTitle').innerText = '🛠️ Add New Menu Item';
            document.getElementById('submitBtn').innerText = 'Add Item ➕';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                menuItems = menuItems.filter(item => item.id !== id);
                localStorage.setItem('gharbaoui_menu_v5', JSON.stringify(menuItems));
                renderCustomerMenu();
            }
        }

        function renderCustomerMenu() {
            const categories = ['All', 'Hot Coffee', 'Specialty Coffee', 'Iced Coffee', 'Iced Frappe', 'Milkshake', 'Smoothie', 'Non-Coffee', 'Mojito', 'Soft Drink', 'Fresh Juice', 'Cookie & Cake', 'Cold Sandwich', 'Main Dish', 'Salad', 'Bakery', 'Breakfast'];
            const tabsContainer = document.getElementById('categoryTabs');
            
            tabsContainer.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeCategory === cat ? 'bg-stone-900 text-white shadow-sm' : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-50'}">
                    ${cat}
                </button>
            `).join('');

            filterMenu();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCustomerMenu();
        }

        function filterMenu() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const gridContainer = document.getElementById('customerMenuGrid');

            let filtered = menuItems.filter(item => {
                const matchesCategory = (activeCategory === 'All' || item.category === activeCategory);
                const matchesSearch = item.name.toLowerCase().includes(searchVal) || (item.desc && item.desc.toLowerCase().includes(searchVal));
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                gridContainer.innerHTML = `<div class="col-span-full text-center py-16 text-stone-400 text-xs">No items found matching your search.</div>`;
                return;
            }

            gridContainer.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-2xl p-3 border border-stone-200/70 shadow-sm flex items-center gap-3.5 relative group hover:border-stone-400 transition">
                    <img src="${item.image}" class="w-20 h-20 rounded-xl object-cover bg-stone-100 flex-shrink-0">
                    <div class="flex-grow min-w-0">
                        <span class="text-[10px] font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded-md inline-block mb-1">${item.category}</span>
                        <h3 class="font-black text-xs sm:text-sm text-stone-900 truncate">${item.name}</h3>
                        <p class="text-[11px] text-stone-400 truncate mt-0.5">${item.desc}</p>
                        <div class="mt-2 font-black text-stone-900 text-xs">${item.price} <span class="text-[10px] font-normal text-stone-400">EGP</span></div>
                    </div>
                    ${isAdminMode ? `
                        <div class="absolute top-2 right-2 flex gap-1">
                            <button onclick="editItem(${item.id})" class="bg-amber-50 text-amber-800 text-[10px] px-2 py-1 rounded-lg font-bold border border-amber-200 hover:bg-amber-800 hover:text-white transition">Edit</button>
                            <button onclick="deleteItem(${item.id})" class="bg-red-50 text-red-600 text-[10px] px-2 py-1 rounded-lg font-bold border border-red-100 hover:bg-red-600 hover:text-white transition">Delete</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
