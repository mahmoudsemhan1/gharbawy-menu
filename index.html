<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بن ومقهى الغرباوي - القائمة الرقمية الفاخرة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Cairo:wght@400;600;700;900&display=swap');
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f7f4ed; 
            background-image: radial-gradient(#e3dac9 0.8px, transparent 0.8px);
            background-size: 20px 20px;
        }

        h1, h2, h3, .vintage-title {
            font-family: 'Playfair Display', 'Cairo', serif;
        }

        /* كارت فخم بلمسة ذهبية خفيفة */
        .luxury-card {
            background: #ffffff;
            border: 1px solid #dfd3c3;
            box-shadow: 0 4px 20px -4px rgba(44, 34, 30, 0.06);
            transition: all 0.3s ease;
        }
        .luxury-card:hover {
            transform: translateY(-3px);
            border-color: #b89778;
            box-shadow: 0 10px 25px -5px rgba(184, 151, 120, 0.2);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-[#2c221e] min-h-screen flex flex-col selection:bg-[#b89778] selection:text-white">

    <!-- Header فخم ومنضبط -->
    <header class="bg-[#1f1714] text-[#f7f4ed] border-b-2 border-[#b89778] sticky top-0 z-50 shadow-lg">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3.5 space-x-reverse">
                <!-- لوجو كبير وبارز -->
                <div class="w-14 h-14 bg-[#2c221e] rounded-2xl p-1 shadow-inner flex items-center justify-center border-2 border-[#b89778]">
                    <img src="logo-01.png" alt="الغرباوي" class="w-full h-full object-contain filter contrast-110">
                </div>
                <div>
                    <h1 class="text-base font-black tracking-wider text-[#f7f4ed] vintage-title">بن ومقهى الغرباوي</h1>
                    <p class="text-[10px] text-[#b89778] tracking-widest uppercase font-semibold">أكثر من 50 سنة خبرة وعراقة</p>
                </div>
            </div>
            
            <div id="adminBadge" class="hidden text-[10px] text-[#1f1714] font-bold bg-[#b89778] px-3 py-1.5 rounded-lg border border-[#8c6d53] shadow">
                ⚙️ وضع الإدارة
            </div>
            <div id="customerBadge" class="text-[10px] text-[#b89778] font-semibold bg-[#2c221e] px-3 py-1.5 rounded-lg border border-[#43332c] shadow">
                ☕ كيف المزاج العالي
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 flex-grow w-full space-y-6">
        
        <!-- Admin Panel -->
        <div id="adminPanelSection" class="hidden bg-[#ffffff] p-5 rounded-2xl shadow-md border border-[#dfd3c3] space-y-4">
            <div class="flex justify-between items-center border-b border-[#f0eae1] pb-3">
                <h2 id="formTitle" class="text-xs font-bold text-[#1f1714]">🛠️ إضافة أو تعديل صنف في القائمة</h2>
                <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden text-[10px] bg-[#dfd3c3] text-[#1f1714] font-bold px-2.5 py-0.5 rounded-md">إلغاء</button>
            </div>
            
            <form id="addItemForm" onsubmit="handleFormSubmit(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="hidden" id="editIndex" value="">
                <div>
                    <label class="block text-[10px] font-bold text-[#7a6b63] mb-1">اسم الصنف</label>
                    <input type="text" id="newName" required placeholder="مثال: إسبريسو" class="w-full px-3 py-2 bg-[#f7f4ed] border border-[#dfd3c3] rounded-xl text-xs outline-none focus:border-[#1f1714] transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-[#7a6b63] mb-1">التصنيف</label>
                    <select id="newCategory" required class="w-full px-3 py-2 bg-[#f7f4ed] border border-[#dfd3c3] rounded-xl text-xs outline-none focus:border-[#1f1714] transition">
                        <option value="قهوة ساخنة">قهوة ساخنة</option>
                        <option value="قهوة مختصة">قهوة مختصة</option>
                        <option value="مشروبات مثلجة">مشروبات مثلجة</option>
                        <option value="مشروبات ساخنة">مشروبات ساخنة</option>
                        <option value="عصائر طازجة">عصائر طازجة</option>
                        <option value="حلويات وكيك">حلويات وكيك</option>
                        <option value="ساندويتشات">ساندويتشات</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-[#7a6b63] mb-1">السعر (جنيه)</label>
                    <input type="number" id="newPrice" required placeholder="65" class="w-full px-3 py-2 bg-[#f7f4ed] border border-[#dfd3c3] rounded-xl text-xs outline-none focus:border-[#1f1714] transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-[#7a6b63] mb-1">رابط الصورة</label>
                    <input type="url" id="newImage" placeholder="https://..." class="w-full px-3 py-2 bg-[#f7f4ed] border border-[#dfd3c3] rounded-xl text-xs outline-none focus:border-[#1f1714] transition">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-[10px] font-bold text-[#7a6b63] mb-1">وصف الصنف</label>
                    <input type="text" id="newDesc" placeholder="تفاصيل الصنف..." class="w-full px-3 py-2 bg-[#f7f4ed] border border-[#dfd3c3] rounded-xl text-xs outline-none focus:border-[#1f1714] transition">
                </div>
                <div class="sm:col-span-2 flex justify-end pt-1">
                    <button type="submit" id="submitBtn" class="bg-[#1f1714] hover:bg-[#2c221e] text-[#f7f4ed] px-5 py-2 rounded-xl text-xs font-bold transition shadow">حفظ الصنف ➕</button>
                </div>
            </form>
        </div>

        <!-- Search & Categories Bar -->
        <div class="space-y-3 sticky top-14 bg-[#f7f4ed] py-2 z-40">
            <div class="relative">
                <input type="text" id="searchInput" oninput="filterMenu()" placeholder="ابحث في القائمة..." class="w-full px-4 py-2.5 pr-10 bg-[#ffffff] border border-[#dfd3c3] rounded-2xl text-xs outline-none focus:border-[#1f1714] shadow-sm transition">
                <span class="absolute right-3.5 top-3 text-[#b89778] text-sm">🔍</span>
            </div>
            <div id="categoryTabs" class="flex overflow-x-auto gap-2 pb-1 no-scrollbar"></div>
        </div>

        <!-- Menu Grid: عنصرين جنب بعض بتصميم نظيف وفاخر -->
        <div id="customerMenuGrid" class="grid grid-cols-2 gap-3.5"></div>
    </main>

    <footer class="text-center py-6 text-[11px] text-[#7a6b63] border-t border-[#dfd3c3] mt-auto bg-[#ffffff] space-y-1">
        <p class="font-bold text-[#1f1714]">بن ومقهى الغرباوي • أصالة التراث وعراقة الصنعة</p>
        <p>جميع الحقوق محفوظة © 2026 ☕</p>
    </footer>

    <script>
        let menuItems = JSON.parse(localStorage.getItem('gharbaoui_menu_final_v1')) || [
            { id: 1, name: 'إسبريسو', category: 'قهوة ساخنة', price: 35, image: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=500&q=80', desc: 'شوت قهوة مركز على أصوله.' },
            { id: 2, name: 'كابتشينو', category: 'قهوة ساخنة', price: 55, image: 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=500&q=80', desc: 'إسبريسو مع حليب مبخر ورغوة ناعمة.' },
            { id: 3, name: 'كافيه لاتيه', category: 'قهوة ساخنة', price: 60, image: 'https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=500&q=80', desc: 'مزيج ناعم من الإسبريسو والحليب الطازج.' },
            { id: 4, name: 'سبانيش لاتيه', category: 'قهوة مختصة', price: 75, image: 'https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=500&q=80', desc: 'إسبريسو وحليب مكثف محلى فاخر.' },
            { id: 5, name: 'في 60 دريب', category: 'قهوة مختصة', price: 80, image: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=500&q=80', desc: 'قهوة مختصة محضرة يدوياً.' },
            { id: 6, name: 'أمريكانو مثلج', category: 'مشروبات مثلجة', price: 50, image: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&w=500&q=80', desc: 'إسبريسو مصبوب فوق الثلج والماء البارد.' },
            { id: 7, name: 'كاراميل ماكياتو', category: 'مشروبات مثلجة', price: 70, image: 'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=500&q=80', desc: 'إسبريسو وحليب مثلج مع صوص الكراميل.' },
            { id: 8, name: 'هوت شوكليت', category: 'مشروبات ساخنة', price: 60, image: 'https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&w=500&q=80', desc: 'مشروب شوكولاتة دافئ وكثيف.' }
        ];

        let activeCategory = 'الكل';
        let isAdminMode = false;

        window.onload = function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            isAdminMode = !isMobile;

            if (isAdminMode) {
                document.getElementById('adminPanelSection').classList.remove('hidden');
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('customerBadge').classList.add('hidden');
            } else {
                document.getElementById('adminPanelSection').classList.add('hidden');
                document.getElementById('adminBadge').classList.add('hidden');
                document.getElementById('customerBadge').classList.remove('hidden');
            }
            renderCustomerMenu();
        };

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editIndex').value;
            const name = document.getElementById('newName').value;
            const category = document.getElementById('newCategory').value;
            const price = parseFloat(document.getElementById('newPrice').value);
            const desc = document.getElementById('newDesc').value || 'تحضير طازج.';
            const image = document.getElementById('newImage').value || 'https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=500&q=80';

            if (editId) {
                let item = menuItems.find(i => i.id == editId);
                if (item) {
                    item.name = name;
                    item.category = category;
                    item.price = price;
                    item.image = image;
                    item.desc = desc;
                }
                alert('تم التعديل بنجاح!');
            } else {
                menuItems.push({ id: Date.now(), name, category, price, image, desc });
                alert('تمت الإضافة بنجاح!');
            }

            localStorage.setItem('gharbaoui_menu_final_v1', JSON.stringify(menuItems));
            resetForm();
            renderCustomerMenu();
        }

        function editItem(id) {
            const item = menuItems.find(i => i.id == id);
            if (!item) return;

            document.getElementById('editIndex').value = item.id;
            document.getElementById('newName').value = item.name;
            document.getElementById('newCategory').value = item.category;
            document.getElementById('newPrice').value = item.price;
            document.getElementById('newImage').value = item.image;
            document.getElementById('newDesc').value = item.desc;

            document.getElementById('formTitle').innerText = '🛠️ تعديل الصنف';
            document.getElementById('submitBtn').innerText = 'تحديث';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('addItemForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('formTitle').innerText = '🛠️ إضافة أو تعديل صنف في القائمة';
            document.getElementById('submitBtn').innerText = 'حفظ الصنف ➕';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function deleteItem(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                menuItems = menuItems.filter(item => item.id !== id);
                localStorage.setItem('gharbaoui_menu_final_v1', JSON.stringify(menuItems));
                renderCustomerMenu();
            }
        }

        function renderCustomerMenu() {
            const categories = ['الكل', 'قهوة ساخنة', 'قهوة مختصة', 'مشروبات مثلجة', 'مشروبات ساخنة', 'عصائر طازجة', 'حلويات وكيك', 'ساندويتشات'];
            const tabsContainer = document.getElementById('categoryTabs');
            
            tabsContainer.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeCategory === cat ? 'bg-[#1f1714] text-[#f7f4ed] shadow-md border border-[#b89778]' : 'bg-[#ffffff] text-[#7a6b63] border border-[#dfd3c3] hover:bg-[#f7f4ed]'}">
                    ${cat}
                </button>
            `).join('');

            filterMenu();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCustomerMenu();
        }

        function filterMenu() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const gridContainer = document.getElementById('customerMenuGrid');

            let filtered = menuItems.filter(item => {
                const matchesCategory = (activeCategory === 'الكل' || item.category === activeCategory);
                const matchesSearch = item.name.toLowerCase().includes(searchVal) || (item.desc && item.desc.toLowerCase().includes(searchVal));
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                gridContainer.innerHTML = `<div class="col-span-full text-center py-16 text-[#7a6b63] text-xs">لا توجد نتائج مطابقة.</div>`;
                return;
            }

            gridContainer.innerHTML = filtered.map(item => `
                <div class="luxury-card rounded-2xl p-3 flex flex-col justify-between relative group">
                    <div>
                        <div class="overflow-hidden rounded-xl mb-2.5 border border-[#dfd3c3]">
                            <img src="${item.image}" class="w-full h-28 object-cover group-hover:scale-105 transition duration-500">
                        </div>
                        <span class="text-[9px] font-bold text-[#b89778] bg-[#f7f4ed] px-2 py-0.5 rounded-md inline-block mb-1 border border-[#dfd3c3]">${item.category}</span>
                        <h3 class="font-bold text-xs sm:text-sm text-[#1f1714] truncate vintage-title">${item.name}</h3>
                        <p class="text-[10px] text-[#7a6b63] line-clamp-2 mt-0.5 leading-relaxed">${item.desc}</p>
                    </div>
                    <div class="mt-3 flex items-center justify-between pt-2 border-t border-[#f0eae1]">
                        <div class="font-black text-[#1f1714] text-xs">${item.price} <span class="text-[9px] font-normal text-[#b89778]">جنيه</span></div>
                    </div>
                    ${isAdminMode ? `
                        <div class="absolute top-2 left-2 flex gap-1 bg-white/95 p-1 rounded-lg backdrop-blur-sm shadow-sm border border-[#dfd3c3]">
                            <button onclick="editItem(${item.id})" class="bg-[#f7f4ed] text-[#1f1714] text-[9px] px-1.5 py-0.5 rounded-md font-bold border border-[#dfd3c3] hover:bg-[#1f1714] hover:text-white transition">تعديل</button>
                            <button onclick="deleteItem(${item.id})" class="bg-red-50 text-red-700 text-[9px] px-1.5 py-0.5 rounded-md font-bold border border-red-200 hover:bg-red-700 hover:text-white transition">حذف</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
