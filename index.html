<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Gharbawy - Digital Menu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfbfa; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-stone-900 min-h-screen flex flex-col selection:bg-amber-800 selection:text-white">

    <!-- Header -->
    <header class="bg-white border-b border-stone-200/85 sticky top-0 z-50 backdrop-blur-md bg-opacity-95">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-stone-900 rounded-xl p-1 shadow-sm flex items-center justify-center border border-amber-800/30">
                    <img src="logo-01.png" alt="Al-Gharbawy" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-xs font-black tracking-wider text-stone-900 uppercase">Al-Gharbawy</h1>
                    <p class="text-[10px] text-stone-400">Digital Menu • Est. 1970</p>
                </div>
            </div>
            
            <div id="adminBadge" class="hidden text-[11px] text-amber-800 font-bold bg-amber-50 px-3 py-1 rounded-lg border border-amber-200">
                ⚙️ Admin Mode
            </div>
            <div id="customerBadge" class="text-[11px] text-stone-600 font-semibold bg-stone-100 px-3 py-1 rounded-lg">
                ☕ Freshly Roasted
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 flex-grow w-full space-y-6">
        
        <!-- Admin Panel: Add New Item -->
        <div id="adminPanelSection" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-stone-200 space-y-4">
            <div class="flex justify-between items-center border-b border-stone-100 pb-3">
                <h2 class="text-xs font-black text-stone-900">🛠️ Add New Menu Item</h2>
                <span class="text-[10px] bg-amber-100 text-amber-900 font-bold px-2.5 py-0.5 rounded-md">Live Update</span>
            </div>
            
            <form id="addItemForm" onsubmit="addNewItem(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Item Name</label>
                    <input type="text" id="newName" required placeholder="e.g. Spanish Latte" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Category</label>
                    <select id="newCategory" required class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                        <option value="Hot Coffee">Hot Coffee</option>
                        <option value="Specialty Coffee">Specialty Coffee</option>
                        <option value="Iced Coffee">Iced Coffee</option>
                        <option value="Iced Frappe">Iced Frappe</option>
                        <option value="Milkshake">Milkshake</option>
                        <option value="Smoothie">Smoothie</option>
                        <option value="Non-Coffee">Non-Coffee</option>
                        <option value="Mojito">Mojito</option>
                        <option value="Soft Drink">Soft Drink</option>
                        <option value="Fresh Juice">Fresh Juice</option>
                        <option value="Cookie & Cake">Cookie & Cake</option>
                        <option value="Cold Sandwich">Cold Sandwich</option>
                        <option value="Main Dish">Main Dish</option>
                        <option value="Salad">Salad</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Breakfast">Breakfast</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Price (EGP)</label>
                    <input type="number" id="newPrice" required placeholder="65" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Image Source (Choose one)</label>
                    <div class="space-y-1.5">
                        <input type="file" id="newImageFile" accept="image/*" class="w-full px-2 py-1 bg-stone-50 border border-stone-200 rounded-xl text-[10px] outline-none file:mr-2 file:py-0.5 file:px-2 file:rounded-lg file:border-0 file:text-[9px] file:font-semibold file:bg-stone-900 file:text-white hover:file:bg-stone-800 transition">
                        <input type="url" id="newImageUrl" placeholder="Or paste image URL here..." class="w-full px-3 py-1.5 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                    </div>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">Description</label>
                    <input type="text" id="newDesc" placeholder="Short ingredients description..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div class="sm:col-span-2 flex justify-end pt-1">
                    <button type="submit" class="bg-stone-900 hover:bg-stone-800 text-white px-5 py-2 rounded-xl text-xs font-bold transition">Add Item ➕</button>
                </div>
            </form>
        </div>

        <!-- Search & Categories Bar -->
        <div class="space-y-3 sticky top-14 bg-[#fcfbfa] py-2 z-40">
            <div class="relative">
                <input type="text" id="searchInput" oninput="filterMenu()" placeholder="Search menu items..." class="w-full px-4 py-2.5 pl-10 bg-white border border-stone-200 rounded-2xl text-xs outline-none focus:border-stone-900 shadow-sm transition">

            </div>
            <div id="categoryTabs" class="flex overflow-x-auto gap-2 pb-1 no-scrollbar">
                <!-- Categories dynamically loaded -->
            </div>
        </div>

        <!-- Menu Grid -->
        <div id="customerMenuGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <!-- Items dynamically loaded -->
        </div>
    </main>

            </div>
        </div>
    </div>

            </form>

        window.onload = function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            isAdminMode = !isMobile;

            if (isAdminMode) {
                document.getElementById('adminPanelSection').classList.remove('hidden');
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('customerBadge').classList.add('hidden');
            } else {
                document.getElementById('adminPanelSection').classList.add('hidden');
                document.getElementById('adminBadge').classList.add('hidden');
                document.getElementById('customerBadge').classList.remove('hidden');
            }
            renderCustomerMenu();

        // إضافة صنف جديد مع دعم رفع الملف أو استخدام الرابط
        function addNewItem(e) {
            e.preventDefault();
            const fileInput = document.getElementById('newImageFile');
            const urlInput = document.getElementById('newImageUrl').value.trim();
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    saveNewItemData(uploadEvent.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else if (urlInput) {
                saveNewItemData(urlInput);
            } else {
                saveNewItemData('https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=500&q=80');
            }
        }

        function saveNewItemData(imgSrc) {

                id: Date.now(),
                name: document.getElementById('newName').value,
                category: document.getElementById('newCategory').value,
                price: parseFloat(document.getElementById('newPrice').value),
                image: imgSrc,
                desc: document.getElementById('newDesc').value || 'Freshly prepared.'
            };
            menuItems.push(newItem);
            localStorage.setItem('gharbaoui_menu_en_v7', JSON.stringify(menuItems));
            document.getElementById('addItemForm').reset();
            renderCustomerMenu();
            alert('Item added successfully!');
        }

        function deleteItem(id, event) {
            event.stopPropagation();
            if (confirm('Are you sure you want to delete this item?')) {
                menuItems = menuItems.filter(item => item.id !== id);
                localStorage.setItem('gharbaoui_menu_en_v7', JSON.stringify(menuItems));
                renderCustomerMenu();
            }
        }

        function openEditModal(id, event) {
            event.stopPropagation();
            const item = menuItems.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('editOldImage').value = item.image;
            document.getElementById('editName').value = item.name;
            document.getElementById('editCategory').value = item.category;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editDesc').value = item.desc || '';
            document.getElementById('editImageFile').value = '';
            document.getElementById('editImageUrl').value = '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        // تحديث الصنف مع دعم رفع الملف أو الرابط الجديد
        function updateItem(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('editId').value);
            const oldImage = document.getElementById('editOldImage').value;
            const fileInput = document.getElementById('editImageFile');
            const urlInput = document.getElementById('editImageUrl').value.trim();

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    saveUpdatedItemData(id, uploadEvent.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else if (urlInput) {
                saveUpdatedItemData(id, urlInput);
            } else {
                saveUpdatedItemData(id, oldImage);
            }
        }

        function saveUpdatedItemData(id, imgSrc) {
            const index = menuItems.findIndex(i => i.id === id);
            if (index !== -1) {
                menuItems[index] = {
                    id: id,
                    name: document.getElementById('editName').value,
                    category: document.getElementById('editCategory').value,
                    price: parseFloat(document.getElementById('editPrice').value),
                    image: imgSrc,
                    desc: document.getElementById('editDesc').value
                };

                localStorage.setItem('gharbaoui_menu_en_v7', JSON.stringify(menuItems));
                closeEditModal();
                renderCustomerMenu();
                alert('Item updated successfully!');
            }
        }

        function openItemDetails(name, category, price, image, desc) {
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalCategory').innerText = category;
            document.getElementById('modalPrice').innerText = price + ' EGP';
            document.getElementById('modalImage').src = image;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        function renderCustomerMenu() {
            const tabsContainer = document.getElementById('categoryTabs');
            
            tabsContainer.innerHTML = categoriesList.map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeCategory === cat ? 'bg-stone-900 text-white shadow-sm' : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-50'}">
                    ${cat}
                </button>
            `).join('');

            filterMenu();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCustomerMenu();
        }

        function filterMenu() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const gridContainer = document.getElementById('customerMenuGrid');

            let filtered = menuItems.filter(item => {
                const matchesCategory = (activeCategory === 'All' || item.category === activeCategory);
                const matchesSearch = item.name.toLowerCase().includes(searchVal) || (item.desc && item.desc.toLowerCase().includes(searchVal));
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                gridContainer.innerHTML = `<div class="col-span-full text-center py-16 text-stone-400 text-xs">No items found matching your search.</div>`;
                return;
            }

            gridContainer.innerHTML = filtered.map(item => {
                const safeName = item.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeDesc = (item.desc || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                return `
                <div onclick="openItemDetails('${safeName}', '${item.category}', ${item.price}, '${item.image}', '${safeDesc}')" class="bg-white rounded-2xl p-3 border border-stone-200/70 shadow-sm flex items-center gap-3.5 relative group hover:border-stone-400 cursor-pointer transition">
                    <img src="${item.image}" class="w-20 h-20 rounded-xl object-cover bg-stone-100 flex-shrink-0">
                    <div class="flex-grow min-w-0">
                        <span class="text-[10px] font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded-md inline-block mb-1">${item.category}</span>
                        <h3 class="font-black text-xs sm:text-sm text-stone-900 truncate">${item.name}</h3>
                        <p class="text-[11px] text-stone-400 truncate mt-0.5">${item.desc}</p>
                        <div class="mt-2 font-black text-stone-900 text-xs">${item.price} <span class="text-[10px] font-normal text-stone-400">EGP</span></div>
                    </div>
                    ${isAdminMode ? `
                        <div class="absolute top-2 left-2 flex gap-1 z-10">
                            <button onclick="openEditModal(${item.id}, event)" class="bg-amber-50 text-amber-800 text-[10px] px-2 py-1 rounded-lg font-bold border border-amber-200 hover:bg-amber-800 hover:text-white transition">Edit</button>
                            <button onclick="deleteItem(${item.id}, event)" class="bg-red-50 text-red-600 text-[10px] px-2 py-1 rounded-lg font-bold border border-red-100 hover:bg-red-600 hover:text-white transition">Delete</button>
                        </div>
                    ` : ''}
                </div>
            `;
            }).join('');
        }
    </script>
</body>
</html>
