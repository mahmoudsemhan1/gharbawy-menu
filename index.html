<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بن الغرباوي - المنيو الرقمي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #fcfbfa; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-stone-900 min-h-screen flex flex-col selection:bg-amber-800 selection:text-white">

    <!-- الهيدر البسيط والأنيق -->
    <header class="bg-white border-b border-stone-200/85 sticky top-0 z-50 backdrop-blur-md bg-opacity-95">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-stone-900 rounded-xl p-1 shadow-sm flex items-center justify-center">
                    <img src="logo-01.png" alt="بن الغرباوي" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-xs font-black tracking-wider text-stone-900">بن الغرباوي</h1>
                    <p class="text-[10px] text-stone-400">المنيو الرقمي المباشر</p>
                </div>
            </div>
            
            <div id="adminBadge" class="hidden text-[11px] text-amber-800 font-bold bg-amber-50 px-3 py-1 rounded-lg border border-amber-200">
                ⚙️ وضع الأدمن (كمبيوتر)
            </div>
            <div id="customerBadge" class="text-[11px] text-stone-600 font-semibold bg-stone-100 px-3 py-1 rounded-lg">
                ☕ أصل القهوة
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 flex-grow w-full space-y-6">
        
        <!-- لوحة التحكم للإدارة (تظهر للكمبيوتر فقط) -->
        <div id="adminPanelSection" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-stone-200 space-y-4">
            <div class="flex justify-between items-center border-b border-stone-100 pb-3">
                <h2 class="text-xs font-black text-stone-900">🛠️ إضافة صنف جديد للمنيو</h2>
                <span class="text-[10px] bg-amber-100 text-amber-900 font-bold px-2.5 py-0.5 rounded-md">تحديث فوري</span>
            </div>
            
            <form id="addItemForm" onsubmit="addNewItem(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">اسم الصنف</label>
                    <input type="text" id="newName" required placeholder="مثال: فلات وايت" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">القسم</label>
                    <input type="text" id="newCategory" required placeholder="مثال: قهوة مختصة" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">السعر (ج.م)</label>
                    <input type="number" id="newPrice" required placeholder="45" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">رابط الصورة (URL)</label>
                    <input type="url" id="newImage" placeholder="https://..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-[10px] font-bold text-stone-500 mb-1">الوصف</label>
                    <input type="text" id="newDesc" placeholder="وصف قصير للمكونات..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs outline-none focus:border-stone-900 transition">
                </div>
                <div class="sm:col-span-2 flex justify-end pt-1">
                    <button type="submit" class="bg-stone-900 hover:bg-stone-800 text-white px-5 py-2 rounded-xl text-xs font-bold transition">إضافة الصنف ➕</button>
                </div>
            </form>
        </div>

        <!-- شريط البحث السريع والأقسام الأفقية (ستايل نظيف ومريح) -->
        <div class="space-y-3 sticky top-16 bg-[#fcfbfa] py-2 z-40">
            <div class="relative">
                <input type="text" id="searchInput" oninput="filterMenu()" placeholder="ابحث في المنيو..." class="w-full px-4 py-2.5 pr-10 bg-white border border-stone-200 rounded-2xl text-xs outline-none focus:border-stone-900 shadow-sm transition">
                <span class="absolute right-3.5 top-3 text-stone-400 text-sm">🔍</span>
            </div>
            <div id="categoryTabs" class="flex overflow-x-auto gap-2 pb-1 no-scrollbar">
                <!-- الأقسام -->
            </div>
        </div>

        <!-- شبكة المنتجات (ستايل كاردات عصرية ومبسطة تشبه المنيو المطلوب) -->
        <div id="customerMenuGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <!-- الأصناف -->
        </div>
    </main>

    <footer class="text-center py-6 text-[11px] text-stone-400 border-t border-stone-200 mt-auto bg-white">
        بن الغرباوي © 2026 ☕
    </footer>

    <script>
        let menuItems = JSON.parse(localStorage.getItem('gharbaoui_menu_v3')) || [
            { id: 1, name: 'إسبريسو دوبل ممتاز', category: 'قهوة مختصة', price: 40, image: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=500&q=80', desc: 'جرعة إسبريسو غنية ومكثفة من بن الغرباوي.' },
            { id: 2, name: 'قهوة تركي مظبوطة', category: 'مشروبات ساخنة', price: 30, image: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=500&q=80', desc: 'بن محوج طازج محضر بالطريقة الأصلية.' },
            { id: 3, name: 'ايس كراميل ماكياتو', category: 'مشروبات باردة', price: 70, image: 'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=500&q=80', desc: 'إسبريسو بارد مع الحليب المثلج وكراميل.' },
            { id: 4, name: 'موخيتو ليمون ونعناع', category: 'منعشات', price: 55, image: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=500&q=80', desc: 'مشروب صودا منعش بالنعناع والليمون.' }
        ];

        let activeCategory = 'الكل';
        let isAdminMode = false;

        window.onload = function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                isAdminMode = false;
                document.getElementById('adminPanelSection').classList.add('hidden');
                document.getElementById('adminBadge').classList.add('hidden');
                document.getElementById('customerBadge').classList.remove('hidden');
            } else {
                isAdminMode = true;
                document.getElementById('adminPanelSection').classList.remove('hidden');
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('customerBadge').classList.add('hidden');
            }
            renderCustomerMenu();
        };

        function addNewItem(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                name: document.getElementById('newName').value,
                category: document.getElementById('newCategory').value.trim(),
                price: parseFloat(document.getElementById('newPrice').value),
                image: document.getElementById('newImage').value || 'https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=500&q=80',
                desc: document.getElementById('newDesc').value || 'طازج يومياً.'
            };
            menuItems.push(newItem);
            localStorage.setItem('gharbaoui_menu_v3', JSON.stringify(menuItems));
            document.getElementById('addItemForm').reset();
            renderCustomerMenu();
            alert('تمت الإضافة بنجاح!');
        }

        function deleteItem(id) {
            if (confirm('هل تريد حذف هذا الصنف؟')) {
                menuItems = menuItems.filter(item => item.id !== id);
                localStorage.setItem('gharbaoui_menu_v3', JSON.stringify(menuItems));
                renderCustomerMenu();
            }
        }

        function renderCustomerMenu() {
            const categories = ['الكل', ...new Set(menuItems.map(i => i.category))];
            const tabsContainer = document.getElementById('categoryTabs');
            
            tabsContainer.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeCategory === cat ? 'bg-stone-900 text-white shadow-sm' : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-50'}">
                    ${cat}
                </button>
            `).join('');

            filterMenu();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCustomerMenu();
        }

        function filterMenu() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const gridContainer = document.getElementById('customerMenuGrid');

            let filtered = menuItems.filter(item => {
                const matchesCategory = (activeCategory === 'الكل' || item.category === activeCategory);
                const matchesSearch = item.name.toLowerCase().includes(searchVal) || (item.desc && item.desc.toLowerCase().includes(searchVal));
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                gridContainer.innerHTML = `<div class="col-span-full text-center py-16 text-stone-400 text-xs">لا توجد نتائج مطابقة لبحثك.</div>`;
                return;
            }

            // تصميم كاردات مبسط ونظيف يشبه الـ Minimalist Menu
            gridContainer.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-2xl p-3 border border-stone-200/70 shadow-sm flex items-center gap-3.5 relative group hover:border-stone-400 transition">
                    <img src="${item.image}" class="w-20 h-20 rounded-xl object-cover bg-stone-100 flex-shrink-0">
                    <div class="flex-grow min-w-0">
                        <span class="text-[10px] font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded-md inline-block mb-1">${item.category}</span>
                        <h3 class="font-black text-xs sm:text-sm text-stone-900 truncate">${item.name}</h3>
                        <p class="text-[11px] text-stone-400 truncate mt-0.5">${item.desc}</p>
                        <div class="mt-2 font-black text-stone-900 text-xs">${item.price} <span class="text-[10px] font-normal text-stone-400">ج.م</span></div>
                    </div>
                    ${isAdminMode ? `<button onclick="deleteItem(${item.id})" class="absolute top-2 left-2 bg-red-50 text-red-600 text-[10px] px-2 py-1 rounded-lg font-bold border border-red-100 hover:bg-red-600 hover:text-white transition">حذف</button>` : ''}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
